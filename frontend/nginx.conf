# IP-адреса в логах не пишем (анонимность участников, §6); query-строки тоже ($uri без args).
log_format noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

# CSP вынесен в переменную, чтобы не дублировать длинную строку.
# HSTS/CSP ставятся на HTML (location /); статике из /assets достаточно nosniff.
map $host $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout noip;

    client_max_body_size 256k;
    server_tokens off;

    # www.movingmotivators.ru → movingmotivators.ru (TLS терминирует Traefik, поэтому схема всегда https)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # имя api резолвится на каждый запрос (DNS Docker), а не при старте:
    # иначе nginx не запустится, пока контейнер api не поднят
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8080;

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        proxy_pass http://$api_upstream;
    }

    # хешированные файлы сборки
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # публичные страницы — пререндеренный HTML (dist/<путь>/index.html), остальное — оболочка SPA
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/index.html /spa.html;
    }
}
