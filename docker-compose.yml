# Production (Coolify, Docker Compose build pack).
# PostgreSQL — отдельный Database-ресурс Coolify. Домен назначается сервису web (порт 80).
#
# Через env — только секреты и то, что зависит от окружения.
# Всё остальное (реквизиты, цены, адрес сайта, отправитель писем, SMTP-порт 465/ssl)
# — в backend/src/Motivators.Api/appsettings.json; любой ключ можно переопределить
# переменной вида Section__Key прямо в Coolify, не меняя этот файл.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "${DB_CONNECTION_STRING}"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"
      App__AdminEmails__0: "${ADMIN_EMAILS}"
      # Monium: логи и трейсы; без ключа или проекта отправка просто выключена
      Monium__Enabled: "${MONIUM__ENABLED:-false}"
      Monium__ApiKey: "${MONIUM__APIKEY}"
      Monium__Project: "${MONIUM_PROJECT}"
      Monium__Cluster: "${MONIUM__CLUSTER:-production}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # не ждём healthy: если api/БД недоступны, сайт всё равно отдаёт статику,
    # а Traefik не отвечает «no available server» на весь домен
    depends_on:
      - api
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik не шлёт трафик, пока контейнер в статусе starting — первая проверка сразу
      start_period: 10s
      start_interval: 2s
